download_history:
  name: Download stored history
  description: Download the stored voltage, state of charge and temperature history from a BM6 battery monitor and import it into long-term statistics.
  fields:
    device_address:
      name: Device address
      description: Bluetooth address of the BM6 device. When omitted, history is downloaded from all configured BM6 devices.
      required: false
      selector:
        text:
    history_page_count:
      name: Stored history pages
      description: Number of stored history pages to download. One page holds 256 records, about 8.5 hours.
      required: false
      selector:
        number:
          min: 1
          max: 10
          mode: box
